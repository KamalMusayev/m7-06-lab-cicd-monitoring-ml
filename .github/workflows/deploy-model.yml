name: Deploy Model

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-model-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write

env:
  IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint OpenAPI spec
        run: npx @redocly/cli lint openapi.yaml

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3
        with:
          dockerfile: Dockerfile

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests
        run: ./scripts/test-unit.sh

      - name: Run contract tests
        run: ./scripts/test-contract.sh

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t "$IMAGE" .

      - name: Save image
        run: docker save "$IMAGE" -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-image
          path: image.tar
          retention-days: 1

  scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: model-image

      - name: Load image
        run: docker load -i image.tar

      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  push:
    runs-on: ubuntu-latest
    needs: scan
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: model-image

      - name: Load image
        run: docker load -i image.tar

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: docker push "$IMAGE"

  deploy-staging:
    runs-on: ubuntu-latest
    needs: push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging
        run: ./scripts/deploy.sh staging "$IMAGE"

  smoke-staging:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Smoke test staging
        run: ./scripts/smoke.sh staging

  deploy-production:
    runs-on: ubuntu-latest
    needs: smoke-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy 10% canary
        run: ./scripts/deploy.sh production "$IMAGE" --canary 10

      - name: Verify canary
        run: ./scripts/canary-verify.sh production "$IMAGE"

      - name: Full production rollout
        run: ./scripts/deploy.sh production "$IMAGE" --full